version = "1.10"

[game]
group_name = "Hassarma-Agents"
group_id = "uoh-mh01"
sub_game_number = 1
members = ["id-0000", "id-0000"]
repos = { cop = "https://github.com/mohamadhassarma/uoh-mh01-police", thief = "https://github.com/mohamadhassarma/uoh-mh01-thief" }

[network]
my_port = 8801                              # MY MCP server port
opponent_url = "http://127.0.0.1:8802/mcp" # the only thing I know about the opponent
turn_timeout_seconds = 180

[strategy]
# PRD-05: the containment brain used for real play. Comment this out (or
# point at a different class) to fall back to the shipped random baseline
# the evaluation harness compares it against.
police_class = "uoh_mh01.domain.police_brain:ContainmentPoliceBrain"

[trash_talk]
# HOW the banter is produced. The MOVE is always pure Python.
provider = "template"   # template (0 tokens, default) | ollama | claude_api | claude_cli

[llm]
model = "claude-opus-4-8[1m]"
step_deadline_seconds = 30

